<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoNexo Industrial</title>
<style>
:root{
  --cyan:#22d3ee; --green:#34d399; --amber:#fbbf24; --red:#fb7185; --purple:#a78bfa;
}
.theme-dark{
  --bg:#081018; --card:#101b25; --card2:#14222e; --text:#f4f7fa; --muted:#91a2b3; --border:#243544;
  --shadow-card:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.6);
  --shadow-pop:0 1px 3px rgba(0,0,0,.4), 0 18px 40px -16px rgba(0,0,0,.7);
  --pill-alpha:20; --pill-border-alpha:66;
}
.theme-light{
  --bg:#f3f7fa; --card:#ffffff; --card2:#eef4f7; --text:#12202b; --muted:#637381; --border:#d7e1e7;
  --shadow-card:0 1px 2px rgba(18,40,60,.06), 0 10px 24px -12px rgba(18,40,60,.16);
  --shadow-pop:0 2px 4px rgba(18,40,60,.08), 0 20px 40px -14px rgba(18,40,60,.22);
  --pill-alpha:14; --pill-border-alpha:45;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important;}
}
html,body{height:100%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:#081018;
}

.app-shell{ display:flex; width:100%; height:100dvh; }

.screen{
  flex:1; min-width:0;
  height:100dvh;
  background:var(--bg);
  overflow:hidden;
  position:relative;
  display:flex; flex-direction:column;
  transition:background .2s;
}
.statusbar{
  height:env(safe-area-inset-top, 0px);
  flex-shrink:0;
}

.content{
  flex:1; overflow-y:auto; padding:14px 16px 100px;
  -webkit-overflow-scrolling:touch;
}
.content::-webkit-scrollbar{width:0;}

/* ---- chrome mobile (site é mobile-only: sempre ativo) ---- */
.mobile-topbar{display:flex;}
.mobile-welcome{display:block;}
.mobile-topbar{height:58px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.mobile-menu,.mobile-profile{width:34px;height:34px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;}
.mobile-brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;line-height:1.05;color:var(--text);}
.mobile-brand span{display:block;color:var(--cyan);font-size:10px;letter-spacing:.02em;}
.mobile-brand-mark{width:27px;height:27px;border-radius:8px;background:#34d39922;display:flex;align-items:center;justify-content:center;}
.mobile-welcome{padding:16px 0 10px;}
.mobile-welcome h1{margin:0 0 4px;color:var(--text);font-size:19px;letter-spacing:-.02em;}
.mobile-welcome p{margin:0;color:var(--muted);font-size:11px;}
.mobile-welcome .mobile-status{display:flex;align-items:center;gap:7px;margin-top:12px;padding:9px 11px;border-radius:11px;background:#22d3ee12;border:1px solid #22d3ee25;color:var(--cyan);font-size:11px;font-weight:800;}
.mobile-status .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}

/* regras que antes só valiam em telas estreitas agora valem sempre (site mobile-only) */
.content{padding:0 14px 104px;}
.dash-right > .app-header{display:none;}
.dash-grid{display:flex;flex-direction:column;gap:0;}
.dash-right,.dash-left{display:flex;flex-direction:column;width:100%;}
.dash-right .last-updated{margin:0 0 10px;}
.kpi-grid{gap:8px;margin-bottom:12px;}
.kpi-card{min-height:102px;padding:12px;}
.kpi-val{font-size:19px;margin:9px 0 2px;}
.section-title{font-size:14px;margin:15px 0 9px;}
.card{border-radius:13px;}
.dash-left .hero{display:none;}
.dash-left .card{margin-bottom:10px;}
.assistant-input{font-size:11px;}

/* ---- sidebar e topbar de desktop: removidos, o site é somente para celular ---- */
.sidebar{ display:none !important; }
.topbar{ display:none !important; }
/* hero banner & assistant quick-ask: blocos exclusivos do desktop */
.dash-hero, .dash-assistant{ display:none; }

/* app-shell ocupa a tela toda, sem coluna lateral */
.app-shell{ justify-content:center; }
.screen{ max-width:520px; margin:0 auto; box-shadow:0 0 60px -20px rgba(0,0,0,.6); }

@media (min-width:99999px){
  .sidebar{
    display:flex; flex-direction:column;
    width:212px; flex-shrink:0;
    --card:#101b25; --card2:#14222e; --text:#f4f7fa; --muted:#91a2b3; --border:#243544;
    background:#081018; border-right:1px solid var(--border); color:var(--text);
    padding:18px 14px; height:100dvh; box-sizing:border-box;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .brand-logo{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    background:#34d39922; display:flex; align-items:center; justify-content:center;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text strong{ font-size:14.5px; color:var(--text); font-weight:900; }
  .brand-text span{ font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.03em; }

  .sidebar-nav{ display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; margin-top:4px; }
  .side-item{
    display:flex; align-items:center; gap:11px; width:100%;
    background:transparent; border:none; text-align:left; cursor:pointer;
    padding:10px 10px; border-radius:10px; font-family:inherit;
    font-size:13px; font-weight:700; color:var(--muted);
    transition:background .15s, color .15s;
  }
  .side-item:hover{ background:var(--card2); color:var(--text); }
  .side-item.active{ background:var(--cyan)1a; color:var(--text); }
  .side-item.active svg{ stroke:var(--cyan); }
  .side-item span:first-of-type{ flex:1; }
  .side-badge{ position:static; margin-left:auto; }
  .side-divider{
    margin:14px 8px 6px; font-size:10.5px; font-weight:800; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); opacity:.7;
  }

  .sidebar-footer{ border-top:1px solid var(--border); padding-top:12px; margin-top:8px; }
  .sidebar-status{
    display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700;
    color:var(--green); background:#34d39914; border:1px solid #34d39933;
    border-radius:10px; padding:8px 10px; margin-bottom:10px;
  }
  .sidebar-user{ display:flex; align-items:center; gap:10px; padding:2px 4px; }
  .sidebar-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:var(--card2); display:flex; align-items:center; justify-content:center; color:var(--muted);
  }
  .sidebar-user-text{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
  .sidebar-user-text strong{ font-size:12.5px; color:var(--text); }
  .sidebar-user-text span{ font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 28px; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .topbar-search{
    display:flex; align-items:center; gap:9px; flex:1; max-width:440px;
    background:var(--card2); border:1px solid var(--border); border-radius:11px;
    padding:9px 13px;
  }
  .topbar-search input{
    flex:1; border:none; background:transparent; outline:none; font-family:inherit;
    font-size:13px; color:var(--text);
  }
  .topbar-search input::placeholder{ color:var(--muted); }
  .kbd-hint{
    font-size:10.5px; font-weight:700; color:var(--muted); border:1px solid var(--border);
    border-radius:5px; padding:2px 6px; flex-shrink:0;
  }
  .topbar-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .topbar-icon-btn, .topbar-avatar{
    position:relative; width:38px; height:38px; border-radius:10px;
    border:1px solid var(--border); background:var(--card2); cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--text);
  }
  .topbar-avatar{ border-radius:50%; color:var(--muted); }
  .topbar-badge{
    position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
    background:#fb7185; border:2px solid var(--card);
  }

  .statusbar, .bottom-nav{ display:none; }
  .app-header .theme-toggle{ display:none; }

  .content{ padding:18px 16px 44px; max-width:1360px; }

  .dash-grid{ display:grid; grid-template-columns:1.5fr 1fr; gap:20px; align-items:start; }
  .dash-left{ grid-column:1; grid-row:1; display:flex; flex-direction:column; }
  .dash-right{ grid-column:2; grid-row:1; display:flex; flex-direction:column; }
  .dash-hero, .dash-assistant{ display:block; }
}


/* header */
.app-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.app-header h2{font-size:20px; font-weight:900; color:var(--text); margin:0 0 3px; letter-spacing:-.01em;}
.app-header .sub{font-size:11.5px; color:var(--muted); margin:0;}
.theme-toggle{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center; background:transparent; cursor:pointer;
  flex-shrink:0;
}

/* card */
.card{
  border:1px solid var(--border); background:var(--card); border-radius:16px; padding:14px;
  box-shadow:var(--shadow-card); transition:box-shadow .2s, border-color .2s;
}
.card + .card{margin-top:12px;}
.kpi-val,.m-metric .val,.stat-cell .val,.two-col .val,.report-row .oee,.chart-tooltip,.trend-chip{
  font-variant-numeric:tabular-nums;
}
.mb12{margin-bottom:12px;}
.mt12{margin-top:12px;}
.mt14{margin-top:14px;}
.section-title{font-size:15.5px; font-weight:900; color:var(--text); margin:16px 0 10px;}
.section-title:first-child{margin-top:0;}

/* status pill */
.status-pill{
  display:inline-flex; align-items:center; gap:5px; padding:5px 9px; border-radius:20px; border:1px solid;
  font-size:10.5px; font-weight:800; flex-shrink:0; white-space:nowrap;
}
.status-dot{width:7px;height:7px;border-radius:4px;}

/* machine card */
.m-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.m-name{font-size:13.5px; font-weight:800; color:var(--text); margin:0 0 2px;}
.m-sub{font-size:11px; color:var(--muted); margin:0;}
.m-metrics{display:flex; flex-wrap:wrap; gap:10px; margin-top:13px;}
.m-metric{width:46%; display:flex; align-items:center; gap:6px;}
.m-metric svg{flex-shrink:0;}
.m-metric .lab{font-size:9.5px; color:var(--muted); display:block;}
.m-metric .val{font-size:11.5px; font-weight:800; color:var(--text); display:block;}
.machine-card{cursor:pointer; transition:transform .1s, border-color .15s;}
.machine-card:active{transform:scale(.985);}

/* kpi grid */
.kpi-grid{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.kpi-card{width:calc(50% - 5px); min-height:112px; display:flex; flex-direction:column; justify-content:center;}
.kpi-val{font-size:21px; font-weight:900; color:var(--text); margin:11px 0 3px;}
.kpi-lab{font-size:11px; color:var(--muted);}

  position:relative; overflow:hidden; border-radius:16px; padding:26px;

  background-position:center, right center; background-size:cover, cover;
  border:1px solid var(--border); margin-bottom:16px;
}
.hero::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(circle at 88% 15%, rgba(34,211,238,.20), transparent 55%),
    radial-gradient(circle at 8% 95%, rgba(52,211,153,.16), transparent 50%);
}
.hero-top{position:relative; display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
.hero-brand{display:flex; align-items:center; gap:11px; margin-bottom:16px;}
.hero-logo{width:40px;height:40px;border-radius:11px;background:#34d39922;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hero h1{position:relative; font-size:24px; margin:0 0 6px; font-weight:900; letter-spacing:-.01em; color:#f4f7fa;}
.hero h1 span{display:block; color:#22d3ee; font-weight:800;}
.hero p.tagline{position:relative; color:#8fa2b3; font-size:13.5px; margin:0 0 18px; max-width:420px; line-height:1.5;}
.hero-status{
  position:relative; flex-shrink:0; display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:800; padding:7px 12px; border-radius:999px; white-space:nowrap;
}
.hero-chips{position:relative; display:flex; flex-wrap:wrap; gap:8px;}
.hero-chip{
  display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1); padding:7px 12px; border-radius:999px;
  font-size:12px; font-weight:700; color:#e6edf2;
}

/* activity feed */
.activity-item{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border);}
.activity-item:last-child{border-bottom:none; padding-bottom:0;}
.activity-item:first-child{padding-top:0;}
.activity-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.activity-body{flex:1; min-width:0;}
.activity-title{font-size:12.5px; font-weight:800; color:var(--text); margin:0;}
.activity-sub{font-size:11.5px; color:var(--muted); margin:2px 0 0;}
.activity-time{font-size:10.5px; color:var(--muted); white-space:nowrap; flex-shrink:0; padding-top:2px;}

/* assistant quick-ask card */
.assistant-input-row{display:flex; gap:8px; margin-top:12px;}
.assistant-input{
  flex:1; background:var(--card2); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px; color:var(--text); font-size:13px; font-family:inherit; outline:none;
}
.assistant-input::placeholder{color:var(--muted);}
.assistant-send{
  width:42px; height:42px; border-radius:12px; background:var(--cyan); border:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
}

/* chart (SVG area) */
.chart-svg{width:100%; height:120px; display:block; overflow:visible;}
.chart-svg .axis-label{font-size:9px; fill:var(--muted); font-family:inherit;}
.chart-svg .dot{fill:var(--cyan); stroke:var(--card); stroke-width:2;}
.chart-svg .dot.peak{fill:var(--text);}
.chart-hint{font-size:10.5px; color:var(--muted); text-align:right; margin-top:2px;}

/* sparkline inside machine card */
.spark-wrap{width:64px; height:26px; flex-shrink:0;}
.spark-wrap svg{display:block; width:100%; height:100%;}

/* trend chip */
.trend-chip{display:inline-flex; align-items:center; gap:3px; font-size:10.5px; font-weight:800; margin-top:2px;}
.trend-chip.up{color:var(--green);}
.trend-chip.down{color:var(--red);}
.trend-chip svg{width:11px;height:11px;}

/* pulse for critical status */
.pulse-dot{position:relative;}
.pulse-dot::after{
  content:''; position:absolute; inset:0; border-radius:inherit; background:inherit;
  animation:pulseRing 1.6s ease-out infinite;
}
@keyframes pulseRing{
  0%{box-shadow:0 0 0 0 rgba(251,113,133,.55);}
  100%{box-shadow:0 0 0 10px rgba(251,113,133,0);}
}

/* page fade-in */
.content.fade-in{animation:contentFade .22s ease both;}
@keyframes contentFade{
  from{opacity:0; transform:translateY(6px);}
  to{opacity:1; transform:translateY(0);}
}

/* skeleton loading */
.skel{border-radius:8px; background:linear-gradient(90deg, var(--card2) 25%, var(--border) 37%, var(--card2) 63%); background-size:400% 100%; animation:skelShine 1.4s ease infinite;}
@keyframes skelShine{0%{background-position:100% 0;}100%{background-position:0 0;}}
.skel-line{height:11px; margin-bottom:8px; width:100%;}
.skel-line.w60{width:60%;}
.skel-line.w40{width:40%;}

/* toast */
.toast-host{position:absolute; left:0; right:0; bottom:88px; display:flex; justify-content:center; z-index:200; pointer-events:none;}
.toast{
  background:var(--text); color:var(--bg); font-size:12.5px; font-weight:700;
  padding:10px 16px; border-radius:12px; box-shadow:var(--shadow-pop);
  opacity:0; transform:translateY(8px); transition:opacity .25s, transform .25s;
  max-width:88%; text-align:center;
}
.toast.show{opacity:1; transform:translateY(0);}

.last-updated{font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:5px; margin:-8px 0 14px;}
.last-updated .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green); animation:livePulse 1.8s ease infinite;}
@keyframes livePulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* input & filters */
.search-input{
  width:100%; border:1px solid var(--border); background:var(--card); color:var(--text);
  border-radius:12px; padding:11px 13px 11px 38px; font-size:13px; margin-bottom:10px;
  font-family:inherit; position:relative;
}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted);}
.filters{display:flex; gap:7px; margin-bottom:14px; overflow-x:auto;}
.filter-chip{
  padding:8px 13px; border-radius:20px; border:1px solid var(--border); font-size:11.5px; font-weight:700;
  color:var(--muted); background:var(--card); white-space:nowrap; cursor:pointer; flex-shrink:0;
}
.filter-chip.active{color:var(--cyan); background:rgba(34,211,238,.13); border-color:var(--cyan);}
.chip-row{display:flex; gap:7px; margin:12px 0 4px; overflow-x:auto; padding-bottom:2px;}
.chip-row .filter-chip{white-space:normal; line-height:1.3; max-width:150px;}

/* buttons */
.primary-btn{
  background:var(--cyan); border:none; border-radius:12px; padding:12px 16px;
  display:inline-flex; align-items:center; gap:7px; font-weight:900; font-size:12.5px;
  color:#001017; cursor:pointer; font-family:inherit;
  box-shadow:0 6px 16px -6px rgba(34,211,238,.5); transition:transform .1s, box-shadow .15s;
}
.primary-btn:active{transform:scale(.97); box-shadow:0 3px 10px -6px rgba(34,211,238,.5);}
.primary-btn:disabled{opacity:.6; cursor:default;}
.mini-btn{
  border:1px solid var(--border); background:var(--card2); color:var(--text);
  font-size:11px; font-weight:700; padding:8px 12px; border-radius:10px; cursor:pointer;
  font-family:inherit; display:inline-flex; align-items:center; gap:5px;
}
.mini-btn.primary{background:var(--cyan); color:#001017; border-color:var(--cyan);}
.ack-note{display:inline-flex; align-items:center; gap:4px; color:var(--green); font-size:11px; font-weight:700;}

/* two col */
.two-col{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;}
.two-col .card{width:calc(50% - 5px); margin:0;}
.two-col .lab{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px;}
.two-col .val{font-size:19px; font-weight:900; color:var(--text); margin-top:9px;}

/* progress */
.prog-row{margin-top:15px;}
.prog-row:first-child{margin-top:0;}
.prog-top{display:flex; justify-content:space-between; margin-bottom:6px;}
.prog-top .name{color:var(--text); font-size:12.5px;}
.prog-top .pct{color:var(--green); font-size:12.5px; font-weight:700;}
.track{height:7px; border-radius:8px; background:rgba(255,255,255,.1); overflow:hidden;}
.theme-light .track{background:rgba(0,0,0,.08);}
.fill{height:100%; background:var(--green); border-radius:8px; transition:width .4s;}

/* generic rows */
.list-card{margin-bottom:12px;}
.report-row{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border); font-size:13px;}
.report-row:last-child{border-bottom:none;}
.report-row .date{color:var(--text); flex:1;}
.report-row .oee{color:var(--cyan); font-weight:700;}

.switch{position:relative; width:44px; height:26px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .slider{position:absolute; inset:0; background:#3a4a58; border-radius:20px; cursor:pointer; transition:.2s;}
.switch .slider::before{content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--green);}
.switch input:checked + .slider::before{transform:translateX(18px);}

.ai-result-row{display:flex; align-items:flex-start; gap:8px; margin-top:8px;}
.ai-result-row .dot{color:var(--cyan); margin-top:1px; font-weight:800; font-size:12px;}
textarea.ai-input, .search-input.ai{
  width:100%; border:1px solid var(--border); background:var(--card2); color:var(--text);
  border-radius:12px; padding:11px 13px; font-size:13px; margin-top:10px; font-family:inherit;
}

/* alerts */
.alert-card .alert-stats{display:flex; gap:14px; margin-top:8px; font-size:11px; color:var(--muted);}
.alert-card .alert-stats span{display:inline-flex; align-items:center; gap:4px;}
.alert-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}

/* forms */
.form-group{margin-bottom:12px;}
.form-group:last-child{margin-bottom:0;}
.form-label{font-size:11px; color:var(--muted); font-weight:700; display:block; margin-bottom:5px;}
.form-select, .form-textarea{
  width:100%; border:1px solid var(--border); background:var(--card2); color:var(--text);
  border-radius:10px; padding:10px 12px; font-size:13px; font-family:inherit;
}
.form-textarea{resize:vertical;}
.checkbox-row{display:flex; align-items:center; gap:10px; padding:8px 0; cursor:pointer; font-size:13px; color:var(--text);}
.checkbox{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.checkbox.checked{background:var(--cyan); border-color:var(--cyan);}

/* breadcrumb / back */
.crumb{display:flex; align-items:center; gap:5px; color:var(--muted); font-size:11.5px; font-weight:700; margin-bottom:10px; cursor:pointer;}
.crumb:active{opacity:.7;}

/* "Mais" menu list */
.more-item{display:flex; align-items:center; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--border); cursor:pointer;}
.more-item:last-child{border-bottom:none;}
.more-item-left{display:flex; align-items:center; gap:12px; color:var(--text); font-size:13.5px; font-weight:700;}

/* nav */
.bottom-nav{
  position:absolute; left:14px; right:14px; bottom:14px; height:64px;
  background:var(--card); border:1px solid var(--border); border-radius:20px;
  display:flex; align-items:center; z-index:20;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.5);
}
.nav-scroll{display:flex; align-items:center; justify-content:space-around; width:100%; padding:4px 8px;}
.nav-item{
  position:relative;
  flex:1; max-width:76px; min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:7px 2px; border-radius:14px; cursor:pointer; border:none; background:transparent;
  font-family:inherit; transition:background .15s, transform .1s;
}
.nav-item:active{transform:scale(.94);}
.nav-item.active{background:rgba(34,211,238,.1);}
.nav-item .label{font-size:7.6px; font-weight:700; color:var(--muted); white-space:nowrap;}
.nav-item.active .label{color:var(--cyan);}
.nav-badge{
  position:absolute; top:1px; right:8px; min-width:14px; height:14px; padding:0 3px;
  border-radius:8px; background:var(--red); color:#fff; font-size:8.5px; font-weight:800;
  display:flex; align-items:center; justify-content:center; line-height:1;
}

.empty-note{color:var(--green); font-weight:700; font-size:13px;}

.footer-note{
  color:#5c7284; font-size:11.5px; text-align:center; max-width:420px; line-height:1.6;
}

/* printable report (hidden unless printing) */
/* ---- splash / boas-vindas ---- */
.splash{
  position:fixed; inset:0; z-index:999;
  max-width:520px; margin:0 auto;
  display:flex; flex-direction:column;
  background:#081018; color:#f4f7fa;
  padding:26px 22px calc(24px + env(safe-area-inset-bottom,0px));
  transition:opacity .35s ease, transform .35s ease;
}
.splash.hidden{ opacity:0; transform:translateY(14px); pointer-events:none; }
.splash-brand{ display:flex; align-items:center; gap:12px; }
.splash-logo{ width:46px;height:46px;border-radius:13px; background:#34d39922; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.splash-title{ font-size:21px; font-weight:900; line-height:1.15; letter-spacing:-.02em; }
.splash-title span{ display:block; color:var(--green); }
.splash-tagline{ margin:14px 0 0; font-size:13px; color:#9fb0c0; max-width:280px; line-height:1.5; }
.splash-photo-wrap{ position:relative; flex:1; min-height:0; margin-top:18px; border-radius:22px; overflow:hidden; }
.splash-photo-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
.splash-photo-wrap::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(8,16,24,.55), rgba(8,16,24,0) 55%); }
.splash-btn{
  margin-top:16px; width:100%; border:none; border-radius:16px; cursor:pointer;
  padding:16px; font-family:inherit; font-size:15px; font-weight:800; color:#001017;
  background:linear-gradient(135deg, var(--green), var(--cyan));
  display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 12px 26px -10px rgba(52,211,153,.5);
}
.splash-btn-secondary{
  margin-top:10px; width:100%; border-radius:16px; cursor:pointer;
  padding:15px; font-family:inherit; font-size:14px; font-weight:800; color:#f4f7fa;
  background:transparent; border:1px solid rgba(255,255,255,.18);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.splash-inline-msg{
  margin:10px 0 0; text-align:center; font-size:11.5px; color:var(--amber);
  background:#fbbf2414; border:1px solid #fbbf2433; border-radius:10px; padding:8px 10px;
  opacity:0; max-height:0; overflow:hidden; transition:opacity .25s ease, max-height .25s ease, margin .25s ease;
}
.splash-inline-msg.show{ opacity:1; max-height:60px; margin:10px 0 0; }
.splash-footnote{ margin:14px 0 0; text-align:center; font-size:11px; color:#9fb0c0; display:flex; align-items:center; justify-content:center; gap:6px; }

#printArea{display:none;}
@media print{
  body > *:not(#printArea){display:none !important;}
  #printArea{display:block !important; background:#fff; color:#000; padding:24px; font-family:Arial,sans-serif;}
  #printArea h1{font-size:20px; margin:0 0 4px;}
  #printArea h2{font-size:14px; margin:22px 0 8px;}
  #printArea table{width:100%; border-collapse:collapse; margin-bottom:10px;}
  #printArea th,#printArea td{border:1px solid #ccc; padding:6px 8px; font-size:11.5px; text-align:left;}
}
</style>
</head>

function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function seededSeries(seed, len, base, variance){
  const out = [];
  for(let i=0;i<len;i++){
    const v = base + variance*Math.sin(seed*0.013 + i*0.6) + variance*0.25*Math.sin(seed*0.007 + i*1.3 + 2);
    out.push(Math.max(0, +v.toFixed(1)));
  }
  return out;
}

function statusPill(v){

  return `<span class="status-pill" style="color:${c};border-color:${c}66;background:${c}20">${level}</span>`;
}
function trendChip(delta, invertColor=false){
  const up = delta >= 0;
  const good = invertColor ? !up : up;
  return `<span class="trend-chip ${good?'up':'down'}">${icon(up?'arrowUp':'arrowDown',11,'currentColor')}${Math.abs(delta).toFixed(1)}%</span>`;
}
function trendFromSeries(vals){
  const mid = Math.max(1, Math.floor(vals.length/2));
  const a = vals.slice(0,mid).reduce((s,v)=>s+v,0)/mid;
  const b = vals.slice(mid).reduce((s,v)=>s+v,0)/((vals.length-mid)||1);
  if(a===0) return 0;
  return ((b-a)/a*100);
}
function formatRelativeTime(ts){
  const diffMin = Math.round((Date.now()-ts)/60000);
  if(diffMin<60) return `há ${diffMin} min`;
  const diffH = Math.round(diffMin/60);
  if(diffH<24) return `há ${diffH} h`;
  const diffD = Math.round(diffH/24);
  return `há ${diffD} d`;
}

function sparkline(history, color){
  const w=64,h=26,pad=3;
  const max=Math.max(...history,1), min=Math.min(...history);
  const range=(max-min)||1;
  const pts = history.map((v,i)=>{
    const x = pad + (i/(history.length-1))*(w-pad*2);
    const y = h - pad - ((v-min)/range)*(h-pad*2);
    return [x,y];
  });
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" class="spark"><path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="${color}"/></svg>`;
}

function areaChart(values, labels){
  const w=280,h=110,padL=6,padR=6,padT=10,padB=18;
  const max=Math.max(...values)*1.15 || 1, min=0;
  const stepX=(w-padL-padR)/(values.length-1);
  const pts = values.map((v,i)=>[padL+i*stepX, padT+(h-padT-padB)*(1-(v-min)/(max-min))]);
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h-padB} L${pts[0][0].toFixed(1)},${h-padB} Z`;
  const peakIdx = values.indexOf(Math.max(...values));
  const gid = 'ag'+Math.random().toString(36).slice(2,8);
  return `
  <svg viewBox="0 0 ${w} ${h}" class="chart-svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--cyan)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--cyan)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#${gid})"/>
    <path d="${linePath}" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===peakIdx?3.4:2.4}" class="dot${i===peakIdx?' peak':''}"/>`).join('')}
    ${labels.map((l,i)=>`<text x="${pts[i][0]}" y="${h-3}" text-anchor="middle" class="axis-label">${l}</text>`).join('')}
  </svg>`;
}

function areaChartTarget(values, labels, target){
  const w=280,h=110,padL=6,padR=6,padT=10,padB=18;
  const max=Math.max(...values,target)*1.1 || 1, min=0;
  const stepX=(w-padL-padR)/(values.length-1);
  const pts = values.map((v,i)=>[padL+i*stepX, padT+(h-padT-padB)*(1-(v-min)/(max-min))]);
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h-padB} L${pts[0][0].toFixed(1)},${h-padB} Z`;
  const gid = 'at'+Math.random().toString(36).slice(2,8);
  const yTarget = padT+(h-padT-padB)*(1-(target-min)/(max-min));
  return `
  <svg viewBox="0 0 ${w} ${h}" class="chart-svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--cyan)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--cyan)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#${gid})"/>
    <line x1="${padL}" y1="${yTarget.toFixed(1)}" x2="${w-padR}" y2="${yTarget.toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="${linePath}" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" class="dot"/>`).join('')}
    ${labels.map((l,i)=>`<text x="${pts[i][0]}" y="${h-3}" text-anchor="middle" class="axis-label">${l}</text>`).join('')}
  </svg>`;
}

function showToast(msg){
  const host = document.getElementById('toastHost');
  if(!host) return;
  const t = document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  host.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 2400);
}

function machineSeries(m, field, period){
  const base = field==='temp' ? m.temp : m.vib;
  const variance = field==='temp' ? (period==='24h'?4:6) : (period==='24h'?0.8:1.2);
  const len = period==='24h' ? 8 : 7;
  const vals = seededSeries(hashStr(m.id+field+period), len, base, variance);
  vals[len-1] = +base.toFixed(1);
  const now = new Date();
  let labs;
  if(period==='24h'){
    labs = Array.from({length:len},(_,i)=>{ const d=new Date(now); d.setHours(d.getHours()-(len-1-i)*3); return d.getHours()+'h'; });
  } else {
    labs = Array.from({length:len},(_,i)=>{ const d=new Date(now); d.setDate(d.getDate()-(len-1-i)); return d.getDate(); });
  }
  return {values:vals, labels:labs};
}

function predictFailure(m){
  if(m.status==='Parada') return {label:'Sem previsão aplicável', detail:'Máquina parada no momento — sem dados de operação para projetar falhas.', color:COLORS.muted};
  const diff = m.temp - m.limite;
  if(diff>5 && m.vib>5) return {label:'Risco alto — próximas 24 a 48h', detail:'Temperatura e vibração simultaneamente acima do esperado. Recomenda-se inspeção imediata.', color:COLORS.red};
  if(diff>0 || m.vib>4.5) return {label:'Risco moderado — próximas 72h', detail:'Parâmetros levemente fora do padrão. Acompanhar a tendência nos próximos dias.', color:COLORS.amber};
  return {label:'Risco baixo', detail:'Operação dentro dos parâmetros esperados. Nenhuma ação necessária.', color:COLORS.green};
}

function computeDiagnostic(query){
  const q = (query||'').toLowerCase();
  let m = machines.find(x=> q.includes(x.nome.toLowerCase()) || q.includes(x.codigo.toLowerCase()));
  if(!m){ m = machines.reduce((best,x)=> (x.temp-x.limite) > (best.temp-best.limite) ? x : best, machines[0]); }
  const diff = m.temp - m.limite;
  const overheating = diff>0;
  const highVib = m.vib>5;
  const lowEf = m.ef<80 && m.status!=='Parada';
  let problema = 'Operação dentro dos parâmetros';
  let severity = 'ok';
  if(overheating){ problema='Superaquecimento'; severity='critico'; }
  else if(highVib){ problema='Vibração elevada'; severity='critico'; }
  else if(lowEf){ problema='Queda de eficiência'; severity='atencao'; }
  const confidence = Math.max(55, Math.min(97, 70 + diff*2 + (highVib?6:0)));
  const last = m.history[m.history.length-1], prev = m.history[Math.max(0,m.history.length-3)];
  const trend = last>prev ? 'aumentando' : last<prev ? 'diminuindo' : 'estável';
  const causes = causesFor(m);
  const action = overheating ? 'Inspecionar sistema de refrigeração, verificar lubrificação e programar manutenção preditiva.'
    : highVib ? 'Verificar alinhamento e fixação dos componentes e agendar inspeção de vibração.'
    : lowEf ? 'Revisar parâmetros operacionais e realizar manutenção preventiva.'
    : 'Nenhuma ação necessária no momento — manter monitoramento padrão.';
  return {kind:'diagnostic', machine:m, problema, confidence, trend, causes, action, severity};
}

/* ============ RENDER ROOT ============ */
function isNavActive(item){
  if(item.page===state.page) return true;
  if(item.page==='Mais' && (state.page==='Mais' || MORE_PAGES.includes(state.page))) return true;
  if(item.page==='Máquinas' && state.page==='MachineDetail') return true;
  return false;
}

function render(){
  const screenEl = document.getElementById('screen');
  screenEl.className = 'screen ' + (state.dark ? 'theme-dark' : 'theme-light');

  const contentEl = document.getElementById('content');
  const prevScroll = contentEl.scrollTop;
  contentEl.innerHTML = RENDERERS[state.page] ? RENDERERS[state.page]() : pageDashboard();
  contentEl.scrollTop = prevScroll;
  if(state.justNavigated){
    contentEl.classList.remove('fade-in');
    void contentEl.offsetWidth;
    contentEl.classList.add('fade-in');
    state.justNavigated = false;
  }
  const clockInline = document.getElementById('clockInline');
  if(clockInline) clockInline.textContent = document.getElementById('clock').textContent;

  const navEl = document.getElementById('nav');
  navEl.innerHTML = MOBILE_NAV_ITEMS.map(item=>{
    const active = isNavActive(item);
    const unread = item.page==='Alertas' ? alerts.filter(a=>a.status==='ativo' && !a.read).length : 0;
    return `
    <button class="nav-item ${active?'active':''}" onclick="goPage('${item.page}')">
      ${icon(item.icon,19, active?'var(--cyan)':'var(--muted)')}
      ${unread>0?`<span class="nav-badge">${unread>9?'9+':unread}</span>`:''}
      <span class="label">${item.label}</span>
    </button>`;
  }).join('');

  renderSidebarNav();
  updateTopbarChrome();
}

function renderSidebarNav(){
  const el = document.getElementById('sidebarNav');
  if(!el) return;
  const itemHtml = (item)=>{
    const active = isNavActive(item);
    const unread = item.page==='Alertas' ? alerts.filter(a=>a.status==='ativo' && !a.read).length : 0;
    return `
    <button class="side-item ${active?'active':''}" onclick="goPage('${item.page}')">
      ${icon(item.icon,17, active?'var(--cyan)':'var(--muted)')}
      <span>${item.label}</span>
      ${unread>0?`<span class="nav-badge side-badge">${unread>9?'9+':unread}</span>`:''}
    </button>`;
  };
  const primary = NAV_ITEMS.filter(i=>i.page!=='Mais');
  const secondary = MORE_PAGES.map(p=>({page:p, label:p, icon:PAGE_ICON_MAP[p]}));
  el.innerHTML = primary.map(itemHtml).join('') + `<div class="side-divider">Mais</div>` + secondary.map(itemHtml).join('');
}

function updateTopbarChrome(){
  const badge = document.getElementById('topbarAlertBadge');
  if(badge){
    const unread = alerts.filter(a=>a.status==='ativo' && !a.read).length;
    badge.style.display = unread>0 ? 'block' : 'none';
  }
  const themeIcon = document.getElementById('topbarThemeIcon');
  if(themeIcon) themeIcon.innerHTML = icon('sun',18,'var(--text)');

function downloadCSV(){
  const data = collectReportData();
  let csv = `Relatório EcoNexo Industrial — Período: ${state.reportForm.periodo} dias\nGerado em: ${new Date().toLocaleString('pt-BR')}\n\n`;
  if(data.machines){ csv+='MÁQUINAS\nNome,Código,Setor,Status,Temp(C),Limite(C),Vibração,Eficiência(%),Potência(kW)\n'; data.machines.forEach(m=>{ csv+=`${m.nome},${m.codigo},${m.setor},${m.status},${m.temp},${m.limite},${m.vib},${m.ef},${m.pot}\n`; }); csv+='\n'; }
  if(data.indicadores){ csv+='INDICADORES\nIndicador,Valor\n'; data.indicadores.forEach(([l,v])=>{ csv+=`${l},${v}\n`; }); csv+='\n'; }
  if(data.alertas){ csv+='ALERTAS\nMáquina,Nível,Causa,Status\n'; data.alertas.forEach(a=>{ csv+=`${a.machina},${a.nivel},${a.causa},${a.status}\n`; }); csv+='\n'; }
  if(data.manutencao){ csv+='MANUTENÇÃO\nOS,Máquina,Tipo,Prioridade,Técnico,Status\n'; data.manutencao.forEach(o=>{ csv+=`${o.os},${o.maquina},${o.tipo},${o.prioridade},${o.tecnico},${o.status}\n`; }); csv+='\n'; }
  if(data.sustentabilidade){ csv+='SUSTENTABILIDADE\nIndicador,Valor\n'; data.sustentabilidade.forEach(([l,v])=>{ csv+=`${l},${v}\n`; }); }
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`relatorio-industria-facil-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast('CSV baixado com sucesso.');
}

  render();

}

/* ---- telemetria em tempo real ---- */
let telemetryTimer = null;
function tickTelemetry(){
  machines = machines.map(m=>{
    if(m.status==='Parada') return m;
    const newTemp = Math.max(18, Math.min(140, m.temp + (Math.random()-0.5)*0.6));
    const newVib = Math.max(0.2, Math.min(12, m.vib + (Math.random()-0.5)*0.3));
    const hist = [...m.history.slice(1), newTemp];
    const vhist = [...m.vibHistory.slice(1), newVib];
    return { ...m, temp:newTemp, vib:newVib, history:hist, vibHistory:vhist };
  });
  document.querySelectorAll('[data-mid]').forEach(el=>{
    const mid = el.getAttribute('data-mid');
    const m = machines.find(x=>x.id===mid);
    if(!m) return;
    const field = el.querySelector('[data-field]');
    if(!field) return;
    const key = field.getAttribute('data-field');
    if(key==='temp') field.textContent = m.temp.toFixed(1)+'°C';
    if(key==='vib') field.textContent = m.vib.toFixed(1)+' mm/s';
  });
}
function startTelemetry(){
  if(telemetryTimer) clearInterval(telemetryTimer);
  telemetryTimer = setInterval(tickTelemetry, state.settings.intervalo);
}

document.getElementById('splashLogoIcon').innerHTML = icon('leaf',22,COLORS.green);
document.getElementById('splashArrowIcon').innerHTML = icon('chevronRight',17,'#001017');
document.getElementById('splashFootIcon').innerHTML = icon('leaf',12,COLORS.green);
function enterApp(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{ const s=document.getElementById('splash'); if(s) s.style.display='none'; }, 400);
}
function tentarCadastro(){
  const msg = document.getElementById('splashCadastroMsg');
  if(!msg) return;
  msg.classList.add('show');
}
document.getElementById('mobileMenuIcon').innerHTML = icon('more',20,'var(--text)');
document.getElementById('mobileBrandIcon').innerHTML = icon('leaf',17,COLORS.green);
document.getElementById('mobileProfileIcon').innerHTML = icon('user',20,'var(--muted)');
document.getElementById('topbarSearchIcon').innerHTML = icon('search',15,'var(--muted)');
document.getElementById('topbarBellIcon').innerHTML = icon('bell',18,'var(--text)');
document.getElementById('topbarAvatarIcon').innerHTML = icon('user',18,'var(--muted)');

document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
    const input = document.getElementById('topbarSearch');
    if(input){ e.preventDefault(); input.focus(); }
  }
});

render();
startTelemetry();
</script>
</body>
</html>
